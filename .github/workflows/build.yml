name: 產生下載檔

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'i18n/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  PANDOC_VERSION: '3.1.11'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 pandoc 與中文字型
        run: |
          wget -q "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk imagemagick opencc zip
          pandoc --version | head -1

      - name: 建置
        run: bash tools/build-book.sh

      - name: 上傳為 workflow 產物
        uses: actions/upload-artifact@v4
        with:
          name: 劍人-下載檔
          path: build/*
          retention-days: 90

      # 打了 vX 標籤 → 掛到該版本的 Release
      - name: 附加到版本 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            build/*.epub build/*.md build/*.txt build/*.zip \
            --clobber

      # 推到 main → 更新固定的 latest 下載點
      - name: 更新 latest 下載
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --prerelease \
              --title "最新全文（隨更新自動重建）" \
              --notes $'本 Release 的檔案由 GitHub Actions 在每次章節更新後自動重建，永遠是最新的完整版本。\n\n正式分卷版本請見其他 Release。\n\n《劍人》© 2026 Yang Hou・CC BY-NC-ND 4.0'
          gh release upload latest \
            build/*.epub build/*.md build/*.txt build/*.zip \
            --clobber
