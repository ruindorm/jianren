name: 建置閱讀網站

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'i18n/**'
      - 'theme/**'
      - 'book.toml'
      - 'tools/build-site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write   # 需要把純文字全文寫回倉庫
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MDBOOK_VERSION: '0.4.40'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 OpenCC
        run: sudo apt-get update -qq && sudo apt-get install -y -qq opencc

      - name: 安裝 mdBook
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz -C /usr/local/bin
          mdbook --version

      - name: 建置
        run: bash tools/build-site.sh

      # 倉庫根目錄也放一份純文字全文，讓 raw.githubusercontent.com 這條路也通。
      # 有些工具擋 github.com 或 github.io，但 raw 網域可以走。
      - name: 同步純文字全文回倉庫
        if: github.ref == 'refs/heads/main'
        run: |
          cp site/full.txt          full.txt
          cp site/en/full.txt       full-en.txt
          cp site/zh-Hans/full.txt  full-zh-Hans.txt
          if git diff --quiet -- full.txt full-en.txt full-zh-Hans.txt; then
            echo "純文字全文無變動，不需要提交"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add full.txt full-en.txt full-zh-Hans.txt
          git commit -m '自動更新純文字全文'
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
